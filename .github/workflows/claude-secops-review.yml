name: Claude Code SecOps PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  secops-review:
    name: Run SecOps Review Kit Plugin
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Claude API key availability
        id: claude-key
        env:
          CLAUDE_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [[ -n "$CLAUDE_API_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Explain skipped Claude review
        if: ${{ steps.claude-key.outputs.available == 'false' }}
        run: |
          echo "::notice::Claude security review was skipped because ANTHROPIC_API_KEY is not configured."
          echo "Add ANTHROPIC_API_KEY in repository Settings > Secrets and variables > Actions to enable automated Claude reviews."
      - name: Run Claude Code with read-only review tools
        if: ${{ steps.claude-key.outputs.available == 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/thanhuydiet207-a11y/Sentinel-Code"
          plugins: "secops-review-kit@internal-secops-marketplace"
          prompt: "/secops-review-kit:pr-security-review"
          claude_args: "--max-turns 10 --allowedTools Read,Grep,Glob,Agent,Bash(git diff *),Bash(git status *),Bash(git log *)"
