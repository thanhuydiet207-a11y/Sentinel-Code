name: Plugin validation

on:
  push:
    branches: [main, "hardening/**", "test/**", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-security-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Validate JSON manifests
        run: |
          jq empty .claude-plugin/plugin.json
          jq empty .claude-plugin/marketplace.json
          jq empty .codex-plugin/plugin.json
          jq empty plugin.json
          jq empty .mcp.json
          jq empty hooks/hooks.json
      - name: Check shell syntax
        run: |
          bash -n scripts/verify-before-push.sh
          bash -n scripts/format-after-edit.sh
          bash -n scripts/install-agent-skills.sh
          bash -n tests/verify-before-push.test.sh
          bash -n tests/format-after-edit.test.sh
          bash -n tests/install-agent-skills.test.sh
      - name: Run shell regression tests
        run: |
          bash tests/verify-before-push.test.sh
          bash tests/format-after-edit.test.sh
          bash tests/install-agent-skills.test.sh
      - name: Validate portable Agent Skill
        run: python3 tests/validate-agent-skills.py
      - name: Validate Agent Plugins and Codex manifests
        run: python3 tests/validate-plugin-manifests.py
      - name: Validate security eval suite structure
        run: python3 tests/validate-eval-suite.py

  mod-runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code test runner
        run: npm install --global @anthropic-ai/claude-code@2.1.323
      - name: Validate Claude Code plugin manifest
        run: |
          claude plugin validate .
          test -f hooks/register.js
      - name: Run Claude Code mod tests
        run: claude plugin test .
