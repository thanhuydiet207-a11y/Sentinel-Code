name: Automated security scanners

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**.py"
      - "**.js"
      - "**.ts"
      - "**.sh"
      - "**.yml"
      - "**.yaml"
      - "**.json"
      - "sentinel_core/**"
      - "scripts/run-security-scanners.sh"
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: pip install semgrep
      - name: Install Gitleaks
        run: |
          version="8.24.2"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Install Trivy
        run: |
          version="0.76.2"
          archive="/tmp/trivy.tar.gz"
          asset="trivy_${version}_Linux-64bit.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/v${version}"
          curl --retry 3 --retry-all-errors -fsSL "$base/$asset" -o "$archive"
          curl --retry 3 --retry-all-errors -fsSL "$base/trivy_${version}_checksums.txt" -o /tmp/trivy-checksums.txt
          expected="$(awk -v asset="$asset" '$2 == asset { print $1 }' /tmp/trivy-checksums.txt)"
          actual="$(sha256sum "$archive" | awk '{ print $1 }')"
          test -n "$expected"
          test "$expected" = "$actual"
          echo "Trivy archive checksum verified"
          tar -tzf "$archive" trivy >/dev/null
          tar -xzf "$archive" -C /tmp trivy
          sudo install /tmp/trivy /usr/local/bin/trivy
          trivy --version
      - name: Run scanners and normalize findings
        run: bash scripts/run-security-scanners.sh "$RUNNER_TEMP/sentinel-results"
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-security-scan
          path: ${{ runner.temp }}/sentinel-results/
          if-no-files-found: warn
          retention-days: 14
